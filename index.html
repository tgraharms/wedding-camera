<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F1E4" />
    <title>Kamera Majlis</title>
    <!-- Shared by link and QR code only, so keep it out of search results.
         Link-preview crawlers still read the og: tags below. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Link preview for shared URLs. Crawlers do not run JS, so these must stay
         static; og:image must be absolute and a JPEG (WhatsApp skips WebP). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wedding-camera-demo.pages.dev/" />
    <meta property="og:title" content="[Husband Name] &amp; [Wife Name] · Kongsi Detik Anda" />
    <meta property="og:description" content="Muat naik gambar-gambar yang anda tangkap semasa majlis kami." />
    <meta property="og:image" content="https://wedding-camera-demo.pages.dev/og-image-demo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Walimatul Urus [Husband Name] &amp; [Wife Name] · Kongsi Detik Anda" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@500;600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
